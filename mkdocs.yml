site_name: Chitta Doc Hub
site_description: A personal documentation hub with blogs and resources.
site_url: https://www.chittapriyamondal.com/
nav:
  - Home: index.md
  - About: about.md
  - Blog:
      - Overview: blog/index.md
      - System One Models & Jev: blog/posts/system-one-model/system-one-model-jev.md
      - Autonomy in Modern AI Systems: blog/posts/agent-autonomy/controlled-vs-governed-autonomy.md
      - Digital Twin & Actor Model : blog/posts/digital-twin-actor-model/digital-twin-actor-model.md
      - Internet Protocol Suite: blog/posts/internet-protocol-suite/internet-protocol-suite.md
      - WSL2 on WINDOWS: blog/posts/wsl2-on-windows/wsl2-on-windows.md
theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/hexagon
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.expand
    - content.code.annotate
    - content.tabs.link
    - toc.integrate
    - search.highlight
    - search.share
  repo_url: https://github.com/Chittapriya/chitta-doc-hub
  repo_name: GitHub
plugins:
  - search
  - blog
  - tags
markdown_extensions:
  - attr_list
  - md_in_html
extra_css:
  - stylesheets/blog-cards.css
